<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>2인 포커 (AI 포함)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
    <h2>닉네임 입력</h2>
    <input id="nickname" placeholder="닉네임">
    <button onclick="enterLobby()">입장</button>
</div>

<div id="lobby" style="display:none;">
    <h2>로비</h2>
    <button onclick="createRoom()">방 만들기 (AI)</button>
</div>

<div id="game" style="display:none;">
    <h2 id="status"></h2>
    <div id="player"></div>
    <div id="bot"></div>
    <button onclick="draw()">카드 교체</button>
</div>

<script src="app.js"></script>
</body>
</html>
